name: Build SwiftBeam Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Java Development Kit (JDK 17)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install NPM Dependencies
      run: |
        npm ci || npm install
        npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Build Web Production Bundle
      run: |
        npm run build

    - name: Initialize Capacitor Android Platform
      run: |
        npx cap init SwiftBeam com.swiftbeam.app --web-dir=dist --web-dir dist
        npx cap add android

    - name: Sync Capacitor Static Files with Android Project
      run: |
        npx cap sync android

    - name: Grant Execute Permissions for Gradle Wrapper
      run: chmod +x android/gradlew

    - name: Compile Release & Build Android APK
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload Built Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: swiftbeam-p2p-file-sharing-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
